<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a1d6b"/>
      <stop offset="0.55" stop-color="#22103a"/>
      <stop offset="1" stop-color="#0d0618"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#ff5a4e" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#ff3d6e" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ff3d6e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="arc" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd36b"/>
      <stop offset="0.45" stop-color="#ff7a4d"/>
      <stop offset="1" stop-color="#ff2f6d"/>
    </linearGradient>
    <radialGradient id="tomato" cx="0.36" cy="0.32" r="0.78">
      <stop offset="0" stop-color="#ff9a7a"/>
      <stop offset="0.28" stop-color="#ff5240"/>
      <stop offset="0.7" stop-color="#e0262f"/>
      <stop offset="1" stop-color="#8f0f24"/>
    </radialGradient>
    <radialGradient id="rim" cx="0.5" cy="1.05" r="0.55">
      <stop offset="0" stop-color="#ff7aa8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff7aa8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9df0a8"/>
      <stop offset="0.5" stop-color="#3fbf6a"/>
      <stop offset="1" stop-color="#1f8a4a"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f9e57"/>
      <stop offset="1" stop-color="#5fd07e"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="plateShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="plate"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
    <path id="body" d="M512 382 C580 358 702 378 740 482 C778 580 752 700 668 758 C604 800 420 800 356 758 C272 700 246 580 284 482 C322 378 444 358 512 382 Z"/>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#plateShadow)"/>
  <g clip-path="url(#plate)">
    <circle cx="512" cy="560" r="420" fill="url(#warm)"/>

    <!-- кольцо таймера -->
    <circle cx="512" cy="540" r="332" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="30"/>
    <g transform="rotate(-90 512 540)">
      <circle cx="512" cy="540" r="332" fill="none" stroke="url(#arc)" stroke-width="30" stroke-linecap="round"
              stroke-dasharray="1564 2086" filter="url(#glow)" opacity="0.9"/>
      <circle cx="512" cy="540" r="332" fill="none" stroke="url(#arc)" stroke-width="30" stroke-linecap="round"
              stroke-dasharray="1564 2086"/>
    </g>
    <circle cx="180" cy="540" r="26" fill="#fff" filter="url(#blur6)" opacity="0.9"/>
    <circle cx="180" cy="540" r="17" fill="#fff"/>

    <!-- тень помидора -->
    <ellipse cx="512" cy="800" rx="210" ry="34" fill="#000" opacity="0.45" filter="url(#soft)"/>

    <!-- помидор -->
    <use href="#body" fill="url(#tomato)"/>
    <use href="#body" fill="url(#rim)"/>
    <ellipse cx="420" cy="480" rx="78" ry="44" transform="rotate(-28 420 480)" fill="#fff" opacity="0.55" filter="url(#blur6)"/>
    <ellipse cx="396" cy="470" rx="22" ry="13" transform="rotate(-28 396 470)" fill="#fff" opacity="0.95"/>

    <!-- чашелистик -->
    <g transform="translate(512 392)">
      <path d="M0 0 C-40 -6 -95 6 -150 46 C-96 34 -52 34 -14 22 Z" fill="url(#leaf)"/>
      <path d="M0 0 C40 -6 95 6 150 46 C96 34 52 34 14 22 Z" fill="url(#leaf)"/>
      <path d="M0 4 C-30 18 -64 54 -78 104 C-46 70 -22 52 6 30 Z" fill="url(#leaf)"/>
      <path d="M0 4 C30 18 64 54 78 104 C46 70 22 52 -6 30 Z" fill="url(#leaf)"/>
      <path d="M-10 6 C-14 40 -6 80 0 112 C8 80 14 40 10 6 Z" fill="url(#leaf)"/>
      <ellipse cx="0" cy="8" rx="34" ry="20" fill="#2f9e57"/>
      <path d="M-8 6 C-12 -40 0 -82 34 -104 C44 -110 52 -98 44 -90 C20 -70 10 -40 12 6 Z" fill="url(#stem)"/>
    </g>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>
  <rect x="101" y="101" width="822" height="822" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>
</svg>
